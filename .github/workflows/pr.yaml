name: Pull Request Checks

on:
  pull_request:

permissions: {}

jobs:
  common-checks:
    name: Common Checks
    permissions:
      contents: read
      pull-requests: read
    uses: nownabe/workflows/.github/workflows/pr.yaml@61479ab352f44180bef4dd8a4d9c19eb68dccb1a # v2.0.4

  filter:
    name: Filter
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changes: ${{ toJSON(steps.filter.outputs) }}
    steps:
      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          filters: |
            check:
              - '**/*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}'
              # Styles and page markup change what the E2E suite renders.
              - '**/*.{css,html}'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'

  check:
    name: Check
    needs: filter
    if: ${{ fromJSON(needs.filter.outputs.changes).check == 'true' }}
    permissions:
      contents: read
    # zizmor prefers the `$/` self-repository syntax, but actionlint (1.7.12) rejects it.
    uses: ./.github/workflows/reusable-check.yaml # zizmor: ignore[self-repository]

  result:
    name: Pull Request Checks
    if: always()
    needs:
      - common-checks
      - check
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: '[[ "$HAS_FAILURE" == "false" && "$HAS_CANCELLED" == "false" ]]'
