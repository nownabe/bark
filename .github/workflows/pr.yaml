name: Pull Request Checks

on:
  pull_request:

permissions: {}

jobs:
  filter:
    name: Filter
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changes: ${{ toJSON(steps.filter.outputs) }}
    steps:
      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          filters: |
            github_workflow:
              - '.github/workflows/**'
            oxfmt:
              - '**/*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}'
              - '**/*.{json,jsonc,json5}'
              - '**/*.{css,scss,less}'
              - '**/*.{yaml,yml,toml}'
              - '**/*.{html,vue,graphql}'
              - '**/*.{md,mdx}'
              - '.oxfmtrc*'
              - 'mise.toml'
              - 'mise.lock'
            oxlint:
              - '**/*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}'
              - '.oxlintrc*'
              - 'oxlint.config.*'
              - 'mise.toml'
              - 'mise.lock'
            shellcheck:
              - '**/*.sh'

  github-workflow:
    name: GitHub Workflow
    needs: filter
    if: ${{ fromJSON(needs.filter.outputs.changes).github_workflow == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-github-workflow.yaml

  oxfmt:
    name: oxfmt
    needs: filter
    if: ${{ fromJSON(needs.filter.outputs.changes).oxfmt == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-oxfmt.yaml

  oxlint:
    name: oxlint
    needs: filter
    if: ${{ fromJSON(needs.filter.outputs.changes).oxlint == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-oxlint.yaml

  shellcheck:
    name: shellcheck
    needs: filter
    if: ${{ fromJSON(needs.filter.outputs.changes).shellcheck == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-shellcheck.yaml

  status-check:
    name: Pull Request Status Check
    if: always()
    needs:
      - github-workflow
      - oxfmt
      - oxlint
      - shellcheck
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: '[[ "$HAS_FAILURE" == "false" && "$HAS_CANCELLED" == "false" ]]'
