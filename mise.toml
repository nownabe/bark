[tools]
"aqua:nodejs/node" = "26.12.0"
"aqua:oven-sh/bun" = "1.3.14"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:suzuki-shunsuke/ghalint" = "1.5.6"
"aqua:zizmorcore/zizmor" = "1.31.0"
"aqua:betterleaks/betterleaks" = "1.9.0"
"aqua:trufflesecurity/trufflehog" = "3.99.2"
"aqua:direnv/direnv" = "2.38.2"
"npm:oxlint" = "1.88.0"
"npm:oxfmt" = "0.73.0"

[settings]
lockfile = true
locked = true
minimum_release_age = "3d"

[tasks.setup]
description = "Initialize the repository"
run = ["mise install", "bun install", "mise generate git-pre-commit --task pre-commit --write"]

[tasks.pre-commit]
description = "Scan staged changes for secrets with betterleaks"
run = "betterleaks git --staged --no-banner --redact"
